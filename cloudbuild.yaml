steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NODE_VERSION=$_NODE_VERSION'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_GIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_GIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - '$_SERVICE_NAME'
      - '--image'
      - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_GIT_SHA'
      - '--region'
      - '$_REGION'
      - '--project'
      - '$PROJECT_ID'
      - '--revision-suffix'
      - 'build-$BUILD_ID'
      - '--update-labels'
      - 'git-sha=${_GIT_SHA},cloud-build-id=$BUILD_ID'
      - '--quiet'
      # Existing Cloud Run environment variables.
      # env-parity-preserved: NODE_ENV,GOOGLE_CLIENT_ID,NEXTAUTH_URL,AUTH_URL,DB_PORT,MYTHORIA_DB,WORKFLOWS_DB,BACKOFFICE_DB
      # env-parity-preserved: GOOGLE_CLOUD_PROJECT_ID,WEBAPP_URL,ADMIN_URL,NEXT_PUBLIC_ADMIN_URL,NEXT_PUBLIC_APP_URL
      # env-parity-preserved: STORY_GENERATION_WORKFLOW_URL,NOTIFICATION_ENGINE_URL,DB_MAX_CONNECTIONS,REFERRAL_INTERNAL_AUDIENCE
      # env-parity-preserved: SURVEY_INTERNAL_AUDIENCE
      # Existing Secret Manager bindings.
      # env-parity-preserved: AUTH_SECRET,GOOGLE_CLIENT_SECRET,DB_HOST,DB_USER,DB_PASSWORD,ADMIN_API_KEY
      # env-parity-preserved: NOTIFICATION_ENGINE_API_KEY,STORY_GENERATION_WORKFLOW_API_KEY,MCP_SECRET_KEY
      # env-parity-preserved: GOOGLE_ANALYTICS_API_SECRET,NEXT_PUBLIC_GA_MEASUREMENT_ID,REFERRAL_MCP_MANAGEMENT_KEY
      # env-parity-preserved: REFERRAL_MCP_FINANCE_KEY

  # Keep production traffic pinned to an explicit revision.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - '$_SERVICE_NAME'
      - '--to-revisions'
      - '${_SERVICE_NAME}-build-$BUILD_ID=100'
      - '--region'
      - '$_REGION'
      - '--quiet'

# Default substitutions
substitutions:
  # ,REFERRAL_MCP_MANAGEMENT_KEY=REFERRAL_MCP_MANAGEMENT_KEY:latest,REFERRAL_MCP_FINANCE_KEY=REFERRAL_MCP_FINANCE_KEY:latest
  _SERVICE_NAME: 'mythoria-admin'
  _GIT_SHA: 'unknown'
  _REGION: 'europe-west9'
  _NODE_VERSION: '24.18.1'
  # Non-sensitive configuration variables

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '100'

timeout: '1200s'

images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$_GIT_SHA'
